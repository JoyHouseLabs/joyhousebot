[project]
name = "joyhousebot-sdk"
version = "0.2.0"
description = "Typed Owner and App client for the joyhousebot public execution API"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["httpx>=0.25,<1", "pyjwt[crypto]>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_sdk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
