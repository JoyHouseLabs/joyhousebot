[project]
name = "joyhousebot-extension-sdk"
version = "2.0.0"
description = "Pure Python ABI for out-of-process joyhousebot Extensions"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_extension_sdk"]
