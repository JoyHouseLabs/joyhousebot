[project]
name = "joyhousebot-capability-media-monitor"
version = "0.1.0"
description = "RSS and Atom media-source monitoring capability for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-media-monitor = "joyhousebot_capability_media_monitor:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_media_monitor"]
