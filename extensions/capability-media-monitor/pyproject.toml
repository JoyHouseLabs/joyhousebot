[project]
name = "porthouse-capability-media-monitor"
version = "0.1.0"
description = "RSS and Atom media-source monitoring capability for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
]

[project.entry-points."porthouse.capabilities"]
capability-media-monitor = "porthouse_capability_media_monitor:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_media_monitor"]
