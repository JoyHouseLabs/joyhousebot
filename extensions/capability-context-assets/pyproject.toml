[project]
name = "porthouse-capability-context-assets"
version = "0.4.0"
description = "Optional durable context, memory, and knowledge capabilities for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "porthouse-capability-document-processing>=0.2.0,<0.3",
    "httpx>=0.25.0",
    "pypdf>=5.0.0,<7",
    "readability-lxml>=0.8.0",
]

[project.entry-points."porthouse.capabilities"]
capability-context-assets = "porthouse_capability_context_assets:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_context_assets"]
