[project]
name = "joyhousebot-capability-context-assets"
version = "0.2.0"
description = "Optional durable context, memory, and knowledge capabilities for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "pypdf>=5.0.0,<7",
    "readability-lxml>=0.8.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-context-assets = "joyhousebot_capability_context_assets:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_context_assets"]
