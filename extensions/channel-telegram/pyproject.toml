[project]
name = "porthouse-channel-telegram"
version = "0.1.0"
description = "Optional Telegram channel extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "python-telegram-bot[socks]>=21.0",
]

[project.entry-points."porthouse.channels"]
channel-telegram = "porthouse_channel_telegram:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_channel_telegram"]
