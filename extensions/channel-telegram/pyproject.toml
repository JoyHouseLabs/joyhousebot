[project]
name = "joyhousebot-channel-telegram"
version = "0.1.0"
description = "Optional Telegram channel extension for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "python-telegram-bot[socks]>=21.0",
]

[project.entry-points."joyhousebot.channels"]
channel-telegram = "joyhousebot_channel_telegram:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_telegram"]
