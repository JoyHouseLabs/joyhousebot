[project]
name = "porthouse-channel-email"
version = "0.1.0"
description = "Official IMAP/SMTP channel extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["porthouse>=0.1.2,<0.2"]

[project.entry-points."porthouse.channels"]
channel-email = "porthouse_channel_email:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_channel_email"]
