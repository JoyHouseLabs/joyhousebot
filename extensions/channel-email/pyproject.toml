[project]
name = "joyhousebot-channel-email"
version = "0.1.0"
description = "Official IMAP/SMTP channel extension for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["joyhousebot>=2.0.0,<3"]

[project.entry-points."joyhousebot.channels"]
channel-email = "joyhousebot_channel_email:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_email"]
