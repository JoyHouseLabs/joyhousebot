[project]
name = "porthouse-connector-mcp-client"
version = "0.1.0"
description = "Optional external MCP client Tool connector for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "mcp>=1.0.0,<2.0",
]

[project.entry-points."porthouse.tool_connectors"]
connector-mcp-client = "porthouse_connector_mcp_client:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_connector_mcp_client"]
