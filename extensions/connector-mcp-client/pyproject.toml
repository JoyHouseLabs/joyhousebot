[project]
name = "joyhousebot-connector-mcp-client"
version = "0.1.0"
description = "Optional external MCP client Capability Connector for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
    "mcp>=1.0.0,<2.0",
]

[project.entry-points."joyhousebot.capability_connectors"]
connector-mcp-client = "joyhousebot_connector_mcp_client:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_connector_mcp_client"]
