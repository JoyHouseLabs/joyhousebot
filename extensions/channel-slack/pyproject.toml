[project]
name = "joyhousebot-channel-slack"
version = "0.1.0"
description = "Optional Slack channel extension for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "slack-sdk>=3.26.0",
]

[project.entry-points."joyhousebot.channels"]
channel-slack = "joyhousebot_channel_slack:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_slack"]
