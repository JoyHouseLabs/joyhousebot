[project]
name = "porthouse-channel-slack"
version = "0.1.0"
description = "Optional Slack channel extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "slack-sdk>=3.26.0",
]

[project.entry-points."porthouse.channels"]
channel-slack = "porthouse_channel_slack:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_channel_slack"]
