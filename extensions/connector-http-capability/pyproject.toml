[project]
name = "porthouse-connector-http-capability"
version = "0.1.1"
description = "Signed HTTP connector for business-owned Porthouse capabilities"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "jsonschema>=4.0.0",
    "rfc8785>=0.1.4,<0.2",
]

[project.entry-points."porthouse.tool_connectors"]
connector-http-capability = "porthouse_connector_http_capability:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_connector_http_capability"]
