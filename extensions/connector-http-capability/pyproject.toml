[project]
name = "joyhousebot-connector-http-capability"
version = "0.1.3"
description = "Signed HTTP connector for business-owned joyhousebot capabilities"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
    "jsonschema>=4.0.0",
    "rfc8785>=0.1.4,<0.2",
]

[project.entry-points."joyhousebot.capability_connectors"]
connector-http-capability = "joyhousebot_connector_http_capability:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_connector_http_capability"]
