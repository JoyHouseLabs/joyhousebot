[project]
name = "joyhousebot-connector-http-capability"
version = "0.1.0"
description = "Signed HTTP connector for business-owned JoyhouseBot capabilities"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "jsonschema>=4.0.0",
]

[project.entry-points."joyhousebot.tool_connectors"]
connector-http-capability = "joyhousebot_connector_http_capability:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_connector_http_capability"]
