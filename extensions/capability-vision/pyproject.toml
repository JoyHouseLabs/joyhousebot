[project]
name = "joyhousebot-capability-vision"
version = "0.1.0"
description = "Optional frozen-asset visual understanding capability for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-vision = "joyhousebot_capability_vision:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_vision"]
