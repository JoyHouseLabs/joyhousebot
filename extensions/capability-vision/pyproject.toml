[project]
name = "porthouse-capability-vision"
version = "0.1.0"
description = "Optional frozen-asset visual understanding capability for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
]

[project.entry-points."porthouse.capabilities"]
capability-vision = "porthouse_capability_vision:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_vision"]
