[project]
name = "porthouse-capability-groq-transcription"
version = "0.1.0"
description = "Groq audio transcription capability extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
]

[project.entry-points."porthouse.capabilities"]
capability-groq-transcription = "porthouse_capability_groq_transcription:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_groq_transcription"]
