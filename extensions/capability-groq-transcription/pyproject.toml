[project]
name = "joyhousebot-capability-groq-transcription"
version = "0.1.0"
description = "Groq audio transcription capability extension for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "httpx>=0.25.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-groq-transcription = "joyhousebot_capability_groq_transcription:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_groq_transcription"]
