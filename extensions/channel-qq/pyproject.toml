[project]
name = "joyhousebot-channel-qq"
version = "0.1.0"
description = "Optional QQ channel extension for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "qq-botpy>=1.0.0",
]

[project.entry-points."joyhousebot.channels"]
channel-qq = "joyhousebot_channel_qq:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_qq"]
