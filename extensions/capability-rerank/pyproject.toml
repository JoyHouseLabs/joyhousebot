[project]
name = "joyhousebot-capability-rerank"
version = "0.1.0"
description = "Optional scoped candidate reranking capability for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["joyhousebot>=0.1.2,<0.2"]

[project.entry-points."joyhousebot.capabilities"]
capability-rerank = "joyhousebot_capability_rerank:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_rerank"]
