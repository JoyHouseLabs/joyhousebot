[project]
name = "joyhousebot-capability-android-device"
version = "0.1.0"
description = "Device-routed Android observe/actuate capabilities for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["joyhousebot>=2.0.0,<3"]

[project.entry-points."joyhousebot.capabilities"]
capability-android-device = "joyhousebot_capability_android_device:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_android_device"]
