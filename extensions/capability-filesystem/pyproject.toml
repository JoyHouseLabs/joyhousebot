[project]
name = "porthouse-capability-filesystem"
version = "0.1.0"
description = "Optional Run-scoped filesystem capabilities for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["porthouse>=0.1.2,<0.2"]

[project.entry-points."porthouse.capabilities"]
capability-filesystem = "porthouse_capability_filesystem:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_filesystem"]
