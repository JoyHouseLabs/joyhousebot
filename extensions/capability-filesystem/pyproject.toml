[project]
name = "joyhousebot-capability-filesystem"
version = "0.1.0"
description = "Optional Run-scoped filesystem capabilities for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["joyhousebot>=2.0.0,<3"]

[project.entry-points."joyhousebot.capabilities"]
capability-filesystem = "joyhousebot_capability_filesystem:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_filesystem"]
