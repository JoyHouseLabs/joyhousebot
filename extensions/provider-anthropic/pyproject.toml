[project]
name = "joyhousebot-provider-anthropic"
version = "0.1.1"
description = "Anthropic Messages model provider extension for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
    "json-repair>=0.30.0",
]

[project.entry-points."joyhousebot.model_providers"]
provider-anthropic = "joyhousebot_provider_anthropic:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_provider_anthropic"]
