[project]
name = "porthouse-capability-shell"
version = "0.1.0"
description = "Optional fail-closed sandbox command capability for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["porthouse>=0.1.2,<0.2"]

[project.entry-points."porthouse.capabilities"]
capability-shell = "porthouse_capability_shell:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_shell"]
