[project]
name = "joyhousebot-capability-document-processing"
version = "0.2.0"
description = "Isolated private document extraction capability for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
    "pypdf>=5.0.0,<7",
    "readability-lxml>=0.8.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-document-processing = "joyhousebot_capability_document_processing:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_document_processing"]
