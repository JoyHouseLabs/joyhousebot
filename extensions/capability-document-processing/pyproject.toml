[project]
name = "porthouse-capability-document-processing"
version = "0.2.0"
description = "Isolated private document extraction capability for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "pypdf>=5.0.0,<7",
    "readability-lxml>=0.8.0",
]

[project.entry-points."porthouse.capabilities"]
capability-document-processing = "porthouse_capability_document_processing:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_document_processing"]
