[project]
name = "porthouse-provider-openai-compatible"
version = "0.1.5"
description = "OpenAI-compatible model provider extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "json-repair>=0.30.0",
]

[project.entry-points."porthouse.model_providers"]
provider-openai-compatible = "porthouse_provider_openai_compatible:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_provider_openai_compatible"]
