[project]
name = "joyhousebot-provider-openai-compatible"
version = "0.1.1"
description = "OpenAI-compatible model provider extension for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "httpx>=0.25.0",
    "json-repair>=0.30.0",
]

[project.entry-points."joyhousebot.model_providers"]
provider-openai-compatible = "joyhousebot_provider_openai_compatible:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_provider_openai_compatible"]
