[project]
name = "joyhousebot-capability-research"
version = "0.1.0"
description = "Optional web research capabilities for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
    "readability-lxml>=0.8.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-research = "joyhousebot_capability_research:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_research"]
