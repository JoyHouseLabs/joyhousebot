[project]
name = "porthouse-channel-dingtalk"
version = "0.1.0"
description = "Optional DingTalk channel extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "dingtalk-stream>=0.4.0",
    "httpx>=0.25.0",
]

[project.entry-points."porthouse.channels"]
channel-dingtalk = "porthouse_channel_dingtalk:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_channel_dingtalk"]
