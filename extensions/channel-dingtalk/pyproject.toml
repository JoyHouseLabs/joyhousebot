[project]
name = "joyhousebot-channel-dingtalk"
version = "0.1.0"
description = "Optional DingTalk channel extension for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "dingtalk-stream>=0.4.0",
    "httpx>=0.25.0",
]

[project.entry-points."joyhousebot.channels"]
channel-dingtalk = "joyhousebot_channel_dingtalk:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_dingtalk"]
