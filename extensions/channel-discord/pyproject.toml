[project]
name = "joyhousebot-channel-discord"
version = "0.1.0"
description = "Optional Discord channel extension for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
    "websockets>=12.0",
]

[project.entry-points."joyhousebot.channels"]
channel-discord = "joyhousebot_channel_discord:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_discord"]
