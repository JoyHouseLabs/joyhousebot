[project]
name = "joyhousebot-channel-feishu"
version = "0.1.0"
description = "Optional Feishu/Lark channel extension for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "lark-oapi>=1.0.0",
]

[project.entry-points."joyhousebot.channels"]
channel-feishu = "joyhousebot_channel_feishu:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_feishu"]
