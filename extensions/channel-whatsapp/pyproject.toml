[project]
name = "joyhousebot-channel-whatsapp"
version = "0.1.0"
description = "Optional WhatsApp channel extension for JoyhouseBot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=0.1.2,<0.2",
    "websockets>=12.0",
]

[project.entry-points."joyhousebot.channels"]
channel-whatsapp = "joyhousebot_channel_whatsapp:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_channel_whatsapp"]
