[project]
name = "porthouse-channel-whatsapp"
version = "0.1.0"
description = "Optional WhatsApp channel extension for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "porthouse>=0.1.2,<0.2",
    "websockets>=12.0",
]

[project.entry-points."porthouse.channels"]
channel-whatsapp = "porthouse_channel_whatsapp:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_channel_whatsapp"]
