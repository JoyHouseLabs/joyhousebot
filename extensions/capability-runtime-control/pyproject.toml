[project]
name = "porthouse-capability-runtime-control"
version = "0.1.0"
description = "Optional model-facing Runtime control capabilities for Porthouse"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["porthouse>=0.1.2,<0.2"]

[project.entry-points."porthouse.capabilities"]
capability-runtime-control = "porthouse_capability_runtime_control:create_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porthouse_capability_runtime_control"]
