[project]
name = "joyhousebot-capability-media-generation"
version = "0.1.0"
description = "Image and video generation capabilities for joyhousebot"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "joyhousebot>=2.0.0,<3",
    "httpx>=0.25.0",
]

[project.entry-points."joyhousebot.capabilities"]
capability-media-generation = "joyhousebot_capability_media_generation:create_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joyhousebot_capability_media_generation"]
