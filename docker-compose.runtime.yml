x-runtime-build: &runtime_build
  context: .
  args:
    PORTHOUSE_EXTENSIONS: ${PORTHOUSE_EXTENSIONS:-provider-openai-compatible}

services:
  postgres:
    # Embedding profiles and HNSW indexes are supported Runtime features, so
    # the standard deployment image must provide pgvector rather than relying
    # on an operator to install a server-side package after boot.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: porthouse
      POSTGRES_USER: porthouse
      # No default password: startup fails fast when it is not provided.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porthouse -d porthouse"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Loopback only: the database must not be reachable from other hosts.
      - "127.0.0.1:${PORTHOUSE_POSTGRES_PORT:-15432}:5432"
    volumes:
      - porthouse_pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init/10-enable-pgvector.sql:/docker-entrypoint-initdb.d/10-enable-pgvector.sql:ro

  # Public data plane only: runs/sessions/schedules + MCP. Admin routes and
  # the console UI are served by the separate `control` service below.
  api:
    build: *runtime_build
    command: ["api", "--surface", "public", "--host", "0.0.0.0", "--port", "18790"]
    environment: &runtime_env
      PORTHOUSE_DATABASE_URL: postgresql://porthouse:${POSTGRES_PASSWORD:?required}@postgres:5432/porthouse
      PORTHOUSE_CONFIG_PATH: /app/config.json
      # Schema is owned by the one-shot migrate service below. Runtime roles
      # must never race DDL with another role's catalog bootstrap writes.
      PORTHOUSE_AUTO_MIGRATE: "false"
      # No default token: /metrics refuses all requests when it is not set.
      PORTHOUSE_METRICS_TOKEN: ${PORTHOUSE_METRICS_TOKEN:?required}
      PORTHOUSE_OTEL_ENABLED: ${PORTHOUSE_OTEL_ENABLED:-false}
      PORTHOUSE_ENVIRONMENT: ${PORTHOUSE_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PROPAGATORS: tracecontext,baggage
    volumes: &runtime_config
      - ${PORTHOUSE_CONFIG_FILE:-./deploy/config.runtime.json}:/app/config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "18790:18790"

  # Private control plane: /v1/admin/* and the console UI (/ui).
  # Loopback only by default — do NOT publish this port to the public
  # internet; reach it via SSH tunnel or an internal network instead.
  control:
    build: *runtime_build
    command: ["api", "--surface", "control", "--host", "0.0.0.0", "--port", "18790"]
    environment:
      <<: *runtime_env
      # One-time values may be removed after the first password change.
      PORTHOUSE_BOOTSTRAP_ADMIN_USER: ${PORTHOUSE_BOOTSTRAP_ADMIN_USER:-}
      PORTHOUSE_BOOTSTRAP_ADMIN_PASSWORD: ${PORTHOUSE_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Persistent 32-byte URL-safe base64 key used to encrypt TOTP secrets.
      PORTHOUSE_AUTH_ENCRYPTION_KEY: ${PORTHOUSE_AUTH_ENCRYPTION_KEY:?required}
      PORTHOUSE_ADMIN_SESSION_HOURS: ${PORTHOUSE_ADMIN_SESSION_HOURS:-12}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORTHOUSE_CONTROL_PORT:-18791}:18790"

  worker:
    build: *runtime_build
    command: ["worker"]
    environment:
      <<: *runtime_env
      # Only Agent Workers import provider extensions or receive model secrets.
      LLM_PROVIDER: ${LLM_PROVIDER:?required}
      LLM_MODEL: ${LLM_MODEL:?required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2

  # Credential-isolating model endpoint for untrusted managed Hosts. It is
  # reachable only on the Compose network and never publishes a host port.
  model-gateway:
    build: *runtime_build
    command: ["model-gateway", "--host", "0.0.0.0", "--port", "18794"]
    environment:
      <<: *runtime_env
      LLM_PROVIDER: ${LLM_PROVIDER:?required}
      LLM_MODEL: ${LLM_MODEL:?required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "18794"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18794/readyz', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12

  scheduler:
    build: *runtime_build
    command: ["scheduler"]
    environment: *runtime_env
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  channel-worker:
    build: *runtime_build
    command: ["channel-worker"]
    environment:
      # Channel worker only submits runs and never calls LLM providers, so it
      # must not inherit provider API keys from the runtime env anchor above.
      PORTHOUSE_DATABASE_URL: postgresql://porthouse:${POSTGRES_PASSWORD:?required}@postgres:5432/porthouse
      PORTHOUSE_CONFIG_PATH: /app/config.json
      PORTHOUSE_AUTO_MIGRATE: "false"
      PORTHOUSE_OTEL_ENABLED: ${PORTHOUSE_OTEL_ENABLED:-false}
      PORTHOUSE_ENVIRONMENT: ${PORTHOUSE_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The only service allowed to apply core schema changes. It completes before
  # any long-running role starts and carries no provider or Channel secrets.
  migrate:
    build: *runtime_build
    command: ["check"]
    environment:
      PORTHOUSE_DATABASE_URL: postgresql://porthouse:${POSTGRES_PASSWORD:?required}@postgres:5432/porthouse
      PORTHOUSE_CONFIG_PATH: /app/config.json
      PORTHOUSE_AUTO_MIGRATE: "true"
      PORTHOUSE_ENVIRONMENT: ${PORTHOUSE_ENVIRONMENT:-production}
      # The one-shot migrator seeds an empty Agent catalog with this exact ID.
      # It does not receive provider credentials or import provider code.
      LLM_MODEL: ${LLM_MODEL:?required}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  porthouse_pg_data:
