x-runtime-build: &runtime_build
  context: .
  args:
    JOYHOUSEBOT_EXTENSIONS: ${JOYHOUSEBOT_EXTENSIONS:-provider-openai-compatible}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: joyhousebot
      POSTGRES_USER: joyhousebot
      # No default password: startup fails fast when it is not provided.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyhousebot -d joyhousebot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Loopback only: the database must not be reachable from other hosts.
      - "127.0.0.1:${JOYHOUSEBOT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - joyhousebot_pg_data:/var/lib/postgresql/data

  # Public data plane only: runs/sessions/schedules + MCP. Admin routes and
  # the console UI are served by the separate `control` service below.
  api:
    build: *runtime_build
    command: ["api", "--surface", "public", "--host", "0.0.0.0", "--port", "18790"]
    environment: &runtime_env
      JOYHOUSEBOT_DATABASE_URL: postgresql://joyhousebot:${POSTGRES_PASSWORD:?required}@postgres:5432/joyhousebot
      JOYHOUSEBOT_CONFIG_PATH: /app/config.json
      # Schema is owned by the one-shot migrate service below. Runtime roles
      # must never race DDL with another role's catalog bootstrap writes.
      JOYHOUSEBOT_AUTO_MIGRATE: "false"
      # No default token: /metrics refuses all requests when it is not set.
      JOYHOUSEBOT_METRICS_TOKEN: ${JOYHOUSEBOT_METRICS_TOKEN:?required}
      JOYHOUSEBOT_OTEL_ENABLED: ${JOYHOUSEBOT_OTEL_ENABLED:-false}
      JOYHOUSEBOT_ENVIRONMENT: ${JOYHOUSEBOT_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_PROPAGATORS: tracecontext,baggage
    volumes: &runtime_config
      - ${JOYHOUSEBOT_CONFIG_FILE:-./deploy/config.runtime.json}:/app/config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "18790:18790"

  # Private control plane: /v1/admin/* and the console UI (/ui).
  # Loopback only by default — do NOT publish this port to the public
  # internet; reach it via SSH tunnel or an internal network instead.
  control:
    build: *runtime_build
    command: ["api", "--surface", "control", "--host", "0.0.0.0", "--port", "18790"]
    environment:
      <<: *runtime_env
      # One-time values may be removed after the first password change.
      JOYHOUSEBOT_BOOTSTRAP_ADMIN_USER: ${JOYHOUSEBOT_BOOTSTRAP_ADMIN_USER:-}
      JOYHOUSEBOT_BOOTSTRAP_ADMIN_PASSWORD: ${JOYHOUSEBOT_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Persistent 32-byte URL-safe base64 key used to encrypt TOTP secrets.
      JOYHOUSEBOT_AUTH_ENCRYPTION_KEY: ${JOYHOUSEBOT_AUTH_ENCRYPTION_KEY:?required}
      JOYHOUSEBOT_ADMIN_SESSION_HOURS: ${JOYHOUSEBOT_ADMIN_SESSION_HOURS:-12}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${JOYHOUSEBOT_CONTROL_PORT:-18791}:18790"

  worker:
    build: *runtime_build
    command: ["worker"]
    environment:
      <<: *runtime_env
      # Only Agent Workers import provider extensions or receive model secrets.
      LLM_PROVIDER: ${LLM_PROVIDER:?required}
      LLM_MODEL: ${LLM_MODEL:?required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2

  scheduler:
    build: *runtime_build
    command: ["scheduler"]
    environment: *runtime_env
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  channel-worker:
    build: *runtime_build
    command: ["channel-worker"]
    environment:
      # Channel worker only submits runs and never calls LLM providers, so it
      # must not inherit provider API keys from the runtime env anchor above.
      JOYHOUSEBOT_DATABASE_URL: postgresql://joyhousebot:${POSTGRES_PASSWORD:?required}@postgres:5432/joyhousebot
      JOYHOUSEBOT_CONFIG_PATH: /app/config.json
      JOYHOUSEBOT_AUTO_MIGRATE: "false"
      JOYHOUSEBOT_OTEL_ENABLED: ${JOYHOUSEBOT_OTEL_ENABLED:-false}
      JOYHOUSEBOT_ENVIRONMENT: ${JOYHOUSEBOT_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The only service allowed to apply core schema changes. It completes before
  # any long-running role starts and carries no provider or Channel secrets.
  migrate:
    build: *runtime_build
    command: ["check"]
    environment:
      JOYHOUSEBOT_DATABASE_URL: postgresql://joyhousebot:${POSTGRES_PASSWORD:?required}@postgres:5432/joyhousebot
      JOYHOUSEBOT_CONFIG_PATH: /app/config.json
      JOYHOUSEBOT_AUTO_MIGRATE: "true"
      JOYHOUSEBOT_ENVIRONMENT: ${JOYHOUSEBOT_ENVIRONMENT:-production}
      # The one-shot migrator seeds an empty Agent catalog with this exact ID.
      # It does not receive provider credentials or import provider code.
      LLM_MODEL: ${LLM_MODEL:?required}
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  joyhousebot_pg_data:
