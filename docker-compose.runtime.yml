services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: joyhousebot
      POSTGRES_USER: joyhousebot
      # No default password: startup fails fast when it is not provided.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joyhousebot -d joyhousebot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Loopback only: the database must not be reachable from other hosts.
      - "127.0.0.1:${JOYHOUSEBOT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - joyhousebot_pg_data:/var/lib/postgresql/data

  api:
    build: .
    command: ["api", "--host", "0.0.0.0", "--port", "18790"]
    environment: &runtime_env
      JOYHOUSEBOT_DATABASE_URL: postgresql://joyhousebot:${POSTGRES_PASSWORD:?required}@postgres:5432/joyhousebot
      JOYHOUSEBOT_CONFIG_PATH: /app/config.json
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes: &runtime_config
      - ${JOYHOUSEBOT_CONFIG_FILE:-./config.example.json}:/app/config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18790:18790"

  worker:
    build: .
    command: ["worker"]
    environment: *runtime_env
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

  scheduler:
    build: .
    command: ["scheduler"]
    environment: *runtime_env
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy

  channel-worker:
    build: .
    command: ["channel-worker"]
    environment:
      # Channel worker only submits runs and never calls LLM providers, so it
      # must not inherit provider API keys from the runtime env anchor above.
      JOYHOUSEBOT_DATABASE_URL: postgresql://joyhousebot:${POSTGRES_PASSWORD:?required}@postgres:5432/joyhousebot
      JOYHOUSEBOT_CONFIG_PATH: /app/config.json
    volumes: *runtime_config
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  joyhousebot_pg_data:
