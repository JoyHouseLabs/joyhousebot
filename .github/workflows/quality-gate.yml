name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  core-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install Core without extensions
        run: uv sync --extra dev --frozen

      - name: Verify extension-free Core distribution
        env:
          JOYHOUSEBOT_CORE_ONLY_TEST: "1"
        run: uv run pytest -q tests/core_only/test_core_only_distribution.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: joyhousebot_test
          POSTGRES_USER: joyhousebot
          POSTGRES_PASSWORD: joyhousebot-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joyhousebot -d joyhousebot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JOYHOUSEBOT_TEST_POSTGRES_URL: postgresql://joyhousebot:joyhousebot-test@127.0.0.1:5432/joyhousebot_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install Python dependencies
        run: |
          uv sync --extra dev --frozen
          bash scripts/install-test-extensions.sh

      - name: Install frontend dependencies
        working-directory: apps/console
        run: npm ci

      - name: Run quality checks
        run: bash scripts/pre_release_check.sh
