[project]
name = "joyhousebot"
version = "0.1.2"
description = "Multi-user distributed Agent cloud runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Joyhouse Team"}
]
maintainers = [
    {name = "Joyhouse Team"}
]
keywords = ["ai", "agent", "runtime", "distributed", "llm", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "httpx[socks]>=0.25.0",
    "loguru>=0.7.0",
    "readability-lxml>=0.8.0",
    "croniter>=2.0.0",
    "dingtalk-stream>=0.4.0",
    "python-telegram-bot[socks]>=21.0",
    "lark-oapi>=1.0.0",
    "slack-sdk>=3.26.0",
    "qq-botpy>=1.0.0",
    "mcp>=1.0.0,<2.0",
    "json-repair>=0.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psycopg[binary,pool]>=3.2.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
]
[project.urls]
Homepage = "https://joyhousebot.com"
Repository = "https://github.com/JoyHouseLabs/joyhousebot"
Documentation = "https://github.com/JoyHouseLabs/joyhousebot/tree/main/docs"
Issues = "https://github.com/JoyHouseLabs/joyhousebot/issues"

[project.scripts]
joyhousebot = "joyhousebot.cli.cloud:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joyhousebot"]

[tool.hatch.build.targets.wheel.sources]
"joyhousebot" = "joyhousebot"

[tool.hatch.build]
include = [
    "joyhousebot/**/*.py",
    "joyhousebot/static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "joyhousebot/",
    "bridges/",
    "evals/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel.force-include]
"bridges/whatsapp" = "joyhousebot/bridges/whatsapp"
"evals/suites" = "joyhousebot/eval_suites"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "postgres: requires JOYHOUSEBOT_TEST_POSTGRES_URL",
]
