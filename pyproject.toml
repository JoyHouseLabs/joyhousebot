[project]
name = "porthouse"
version = "0.1.2"
description = "PostgreSQL-first personal Agent runtime for durable, governed execution"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Porthouse Team"}
]
maintainers = [
    {name = "Porthouse Team"}
]
keywords = ["ai", "agent", "runtime", "personal", "opc", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "loguru>=0.7.0",
    "croniter>=2.0.0",
    "cryptography>=46.0.0",
    "mcp>=1.0.0,<2.0",
    "json-repair>=0.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "psycopg[binary,pool]>=3.2.0",
    "jsonschema>=4.0.0",
    "rfc8785>=0.1.4,<0.2",
    "tuf>=7.0.0,<8",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
]
[project.urls]
Homepage = "https://porthouse.happayhouselabs.com/"
Repository = "https://github.com/HappyHouseLabs/porthouse"
Documentation = "https://github.com/HappyHouseLabs/porthouse/tree/main/docs"
Issues = "https://github.com/HappyHouseLabs/porthouse/issues"

[project.scripts]
porthouse = "porthouse.cli.runtime:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["porthouse"]

[tool.hatch.build.targets.wheel.sources]
"porthouse" = "porthouse"

[tool.hatch.build]
include = [
    "porthouse/**/*.py",
    "porthouse/static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "porthouse/",
    "evals/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel.force-include]
"evals/suites" = "porthouse/eval_suites"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    "extensions/capability-android-device/src",
    "extensions/channel-dingtalk/src",
    "extensions/capability-context-assets/src",
    "extensions/capability-document-processing/src",
    "extensions/capability-filesystem/src",
    "extensions/capability-groq-transcription/src",
    "extensions/capability-media-generation/src",
    "extensions/capability-media-monitor/src",
    "extensions/capability-research/src",
    "extensions/capability-rerank/src",
    "extensions/capability-vision/src",
    "extensions/capability-runtime-control/src",
    "extensions/capability-shell/src",
    "extensions/connector-mcp-client/src",
    "extensions/connector-http-capability/src",
    "extensions/channel-discord/src",
    "extensions/channel-email/src",
    "extensions/channel-feishu/src",
    "extensions/channel-qq/src",
    "extensions/channel-slack/src",
    "extensions/channel-telegram/src",
    "extensions/channel-whatsapp/src",
    "extensions/provider-anthropic/src",
    "extensions/provider-openai-compatible/src",
]
markers = [
    "postgres: requires PORTHOUSE_TEST_POSTGRES_URL",
]
