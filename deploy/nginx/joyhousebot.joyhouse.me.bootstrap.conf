# Temporary HTTP-only virtual host used for the first Let's Encrypt challenge.
server {
    listen 80;
    listen [::]:80;
    server_name joyhousebot.joyhouse.me;

    root /opt/joyhousebot-site/current;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
