# HTTP-level response compression for Porthousebot's JSON API and static UI.
# SSE is deliberately omitted so event streams retain immediate delivery.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
