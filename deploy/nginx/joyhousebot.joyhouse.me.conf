# joyhousebot static product website.
server {
    listen 80;
    listen [::]:80;
    server_name joyhousebot.joyhouse.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://joyhousebot.joyhouse.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joyhousebot.joyhouse.me;

    root /opt/joyhousebot-site/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/joyhousebot.joyhouse.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyhousebot.joyhouse.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/joyhousebot.joyhouse.me.access.log;
    error_log /var/log/nginx/joyhousebot.joyhouse.me.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|ico)$ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
