# Porthouse public entrypoint.
server {
    listen 80;
    listen [::]:80;
    server_name porthouse.happayhouselabs.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/le;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name porthouse.happayhouselabs.com;

    ssl_certificate     /etc/letsencrypt/live/porthouse.happayhouselabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/porthouse.happayhouselabs.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;

    # Keep the UI mounted at /ui/ (its compiled assets use this public base),
    # while making the domain root a convenient canonical entrypoint.
    location = / {
        return 302 /ui/;
    }

    location /ui/ {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API, health endpoints, SSE and future websocket upgrades all share the
    # same gateway origin, eliminating CORS and preserving streaming support.
    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
