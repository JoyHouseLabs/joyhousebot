groups:
  - name: porthouse-runtime
    rules:
      - alert: PorthouseApiDown
        expr: porthouse_up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Porthouse API or PostgreSQL metrics path is down"}
      - alert: PorthouseNoWorkers
        expr: sum(porthouse_workers_total{status="online"}) == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "No online Porthouse execution workers"}
      - alert: PorthouseStaleWorkers
        expr: porthouse_workers_stale_total > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "One or more Porthouse worker heartbeats are stale"}
      - alert: PorthouseQueueStalled
        expr: porthouse_queue_oldest_age_seconds > 300
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Oldest queued Task has waited over five minutes"}
      - alert: PorthouseClaimSLOMiss
        expr: porthouse_task_claim_delay_ms_p95 > 2000
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Task claim p95 exceeds the two-second SLO"}
      - alert: PorthouseExpiredTaskLease
        expr: porthouse_queue_expired_leases_total > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "A running Task has an expired lease"}
      - alert: PorthouseProviderErrorRatio
        expr: sum(rate(porthouse_provider_requests_total{status=~"error|failed"}[5m])) / clamp_min(sum(rate(porthouse_provider_requests_total[5m])), 0.001) > 0.10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Provider error ratio exceeds ten percent"}
      - alert: PorthouseApprovalBacklog
        expr: porthouse_approval_oldest_pending_seconds > 86400
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "An approval has been pending for over one day"}
      - alert: PorthouseManualReconciliationRequired
        expr: sum(porthouse_reconciliations_total{status="manual_required"}) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "An external operation requires manual reconciliation"}
      - alert: PorthouseVerificationStalled
        expr: porthouse_oldest_active_seconds{kind="verification"} > 300
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "An output verification has been running over five minutes"}
      - alert: PorthouseSagaStalled
        expr: porthouse_oldest_active_seconds{kind="saga"} > 900
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "A Saga compensation has been active over fifteen minutes"}
      - alert: PorthouseEvalStalled
        expr: porthouse_oldest_active_seconds{kind="eval"} > 1800
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "An Eval run has been active over thirty minutes"}
      - alert: PorthouseLeaseLossObserved
        expr: porthouse_critical_events_24h_total{event_type="lease.lost"} > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "At least one runtime lease was lost in the last 24 hours"}
      - alert: PorthouseSagaFailureObserved
        expr: porthouse_critical_events_24h_total{event_type=~"saga.failed|compensation.failed"} > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "A Saga or compensation failed in the last 24 hours"}
      - alert: PorthouseDeadChannelOutbox
        expr: sum(porthouse_channel_outbox_total{status="dead"}) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Channel outbox contains dead messages"}
      - alert: PorthouseApiTokenRotationOverdue
        expr: porthouse_api_token_risks_total{risk="rotation_overdue"} > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "One or more API tokens are past their rotation deadline"}
      - alert: PorthouseIndefiniteApiToken
        expr: porthouse_api_token_risks_total{risk="indefinite"} > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "An enabled legacy API token has no expiration"}
