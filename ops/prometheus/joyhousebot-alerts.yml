groups:
  - name: joyhousebot-runtime
    rules:
      - alert: JoyhouseBotApiDown
        expr: joyhousebot_up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "JoyhouseBot API or PostgreSQL metrics path is down"}
      - alert: JoyhouseBotNoWorkers
        expr: sum(joyhousebot_workers_total{status="online"}) == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "No online JoyhouseBot execution workers"}
      - alert: JoyhouseBotStaleWorkers
        expr: joyhousebot_workers_stale_total > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "One or more JoyhouseBot worker heartbeats are stale"}
      - alert: JoyhouseBotQueueStalled
        expr: joyhousebot_queue_oldest_age_seconds > 300
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Oldest queued Task has waited over five minutes"}
      - alert: JoyhouseBotClaimSLOMiss
        expr: joyhousebot_task_claim_delay_ms_p95 > 2000
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Task claim p95 exceeds the two-second SLO"}
      - alert: JoyhouseBotExpiredTaskLease
        expr: joyhousebot_queue_expired_leases_total > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "A running Task has an expired lease"}
      - alert: JoyhouseBotProviderErrorRatio
        expr: sum(rate(joyhousebot_provider_requests_total{status=~"error|failed"}[5m])) / clamp_min(sum(rate(joyhousebot_provider_requests_total[5m])), 0.001) > 0.10
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Provider error ratio exceeds ten percent"}
      - alert: JoyhouseBotApprovalBacklog
        expr: joyhousebot_approval_oldest_pending_seconds > 86400
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "An approval has been pending for over one day"}
      - alert: JoyhouseBotManualReconciliationRequired
        expr: sum(joyhousebot_reconciliations_total{status="manual_required"}) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "An external operation requires manual reconciliation"}
      - alert: JoyhouseBotVerificationStalled
        expr: joyhousebot_oldest_active_seconds{kind="verification"} > 300
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "An output verification has been running over five minutes"}
      - alert: JoyhouseBotSagaStalled
        expr: joyhousebot_oldest_active_seconds{kind="saga"} > 900
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "A Saga compensation has been active over fifteen minutes"}
      - alert: JoyhouseBotEvalStalled
        expr: joyhousebot_oldest_active_seconds{kind="eval"} > 1800
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "An Eval run has been active over thirty minutes"}
      - alert: JoyhouseBotLeaseLossObserved
        expr: joyhousebot_critical_events_24h_total{event_type="lease.lost"} > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "At least one runtime lease was lost in the last 24 hours"}
      - alert: JoyhouseBotSagaFailureObserved
        expr: joyhousebot_critical_events_24h_total{event_type=~"saga.failed|compensation.failed"} > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "A Saga or compensation failed in the last 24 hours"}
      - alert: JoyhouseBotDeadChannelOutbox
        expr: sum(joyhousebot_channel_outbox_total{status="dead"}) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Channel outbox contains dead messages"}
      - alert: JoyhouseBotApiTokenRotationOverdue
        expr: joyhousebot_api_token_risks_total{risk="rotation_overdue"} > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "One or more API tokens are past their rotation deadline"}
      - alert: JoyhouseBotIndefiniteApiToken
        expr: joyhousebot_api_token_risks_total{risk="indefinite"} > 0
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "An enabled legacy API token has no expiration"}
